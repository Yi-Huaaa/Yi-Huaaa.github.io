# Talks & presentations, shown on the homepage map (block: talk-map, layouts/_partials/hbx/blocks/talk-map/).
# Source: "Talks & Presentations" section of the CV (static/uploads/Yi-Hua-Chung-CV-*.pdf).
#
# Fields:
#   title       talk / paper title (for attended conferences: what I was there for)
#   type        e.g. Oral Presentation, Invited Talk, Poster Presentation
#   kind        "talk" (default) or "attended" for conferences I attended (gray flag, not counted as a talk)
#   event       short event name (shown on the map and in the list)
#   event_full  full conference name (optional)
#   date        "YYYY-MM-DD" (first day of the event). Talks dated after the site's build time are shown as "Upcoming".
#   city, country, lat, lng   where the talk took place; talks in the same city share one flag.
#                             Omit lat/lng for remote talks (listed, but no flag on the map).
#   remote      true for online talks (optional)
#   url         link to the paper page (optional)
#   note        short highlight such as an award (optional)

# Optional hand placement for crowded cities on the world map: [right, down] in pixels from the
# city's true position (at the default world view). Cities listed here are not auto-spread.
# Keys are "City, Country" exactly as in the talks below.
